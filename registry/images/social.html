<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
/*TOKENS*/
/* Link preview (1280 × 640, GitHub's recommended size), opaque, light theme.
   Open Graph image of the GitHub Pages site and the repository's social preview. */
body { background: var(--ground); width: 1280px; height: 640px; padding: 56px 64px; display: grid; grid-template-columns: 1fr 520px; gap: 56px; align-items: stretch; overflow: hidden; }
.left { display: flex; flex-direction: column; border-top: 4px solid var(--ink); padding-top: 22px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: .98; margin: 14px 0 0; letter-spacing: -0.015em; }
.sub { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 28px; line-height: 1.25; color: var(--ink-2); margin-top: 18px; }
.foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.url { font-family: var(--font-mono); font-size: 20px; color: var(--accent); }
.by { font-size: 17px; color: var(--ink-2); }
.right { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.drawer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cell { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 12px; }
.cell .id { font-family: var(--font-mono); font-size: 19px; font-weight: 500; color: var(--accent); }
.mk { width: 14px; height: 14px; border-width: 2px; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 16px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 9px; }
</style></head>
<body>
<div class="left">
  <div class="label" style="font-size:15px">A field guide to bugs that don't crash</div>
  <h1>Silent Failures Registry</h1>
  <div class="sub">Twenty ways scientific and ML code returns a wrong answer without raising an error.</div>
  <div class="foot"><span class="url">axelnoun.github.io/silent-failures</span><span class="by">Axel Coiffard-Donaty · EN / FR · each class anchored to a public specimen</span></div>
</div>
<div class="right">
  <div class="drawer" id="drawer"></div>
  <div class="legend" id="legend"></div>
</div>
<script>
/*DATA*/
document.getElementById("drawer").innerHTML = REG.map(e => `<div class="cell"><i class="mk ${e.detect}"></i><span class="id">${e.id}</span></div>`).join("");
const n = k => REG.filter(e => e.detect === k).length;
document.getElementById("legend").innerHTML =
  `<span><i class="mk static"></i>static detector in sfradar · ${n("static")}</span>` +
  `<span><i class="mk heuristic"></i>heuristic, a person confirms · ${n("heuristic")}</span>` +
  `<span><i class="mk manual"></i>manual review only · ${n("manual")}</span>`;
</script>
</body></html>
